  description: >-
    The API surface behind Synergy, AccessFintech's post-trade collaboration network. The
    shipped web client calls a GraphQL endpoint at https://api.accessfintech.com/gql
    (operation name mirrored into the query string as ?operation=<name>) alongside a REST
    surface on the same origin, authenticated by an Okta-issued session and scoped per
    acting organization via an x-context-org-id header. Access is granted to onboarded
    network members; there is no public reference, specification or sign-up.
