  detail: >-
    The Synergy API is real and reachable — the shipped web client calls GraphQL at
    https://api.accessfintech.com/gql — but AccessFintech publishes no developer site at all:
    api.accessfintech.com answers every unknown path with the same 4700-byte React shell,
    /api/docs returns a bare 401, and anonymous GraphQL introspection is refused with a 403 at
    the CloudFront edge, so the contract is readable only with an onboarded member's session.
