      - DELETE https://login.accessfintech.com/api/v1/sessions/me
    app_routes:
      - /api/auth/login
      - /api/auth/logout
      - /api/auth/sso
    headers:
      csrf: x-csrf-token
      organization_context: x-context-org-id
      correlation: x-correlation-id

