aid: accessfintech
name: AccessFintech
description: >-
  AccessFintech operates Synergy, a post-trade data and workflow network for capital
  markets that connects buy-side firms, broker-dealers, custodians, hedge funds, order
  management systems and vendors onto a shared view of trade, settlement and collateral
  data. The platform normalizes fragmented data across securities, derivatives and
  alternatives, detects breaks and exceptions across counterparties, and lets the parties
  to a trade resolve them collaboratively on a single record instead of by email and
  reconciliation files. AccessFintech describes Synergy as API-first, with bi-directional
  integrations, ingestion of JSON, XML, CSV and delimited text over push or pull, and
  Snowflake-native data sharing on AWS. The API surface is not self-serve: the Synergy
  application and its GraphQL and REST endpoints sit behind an Okta-backed customer login
  at login.accessfintech.com, and no public developer portal, reference or machine-readable
  specification is published.
